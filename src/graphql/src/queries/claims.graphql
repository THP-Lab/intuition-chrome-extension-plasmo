query GetClaimsByAddress($address: String) {
  claims_aggregate(where: { account_id: { _eq: $address } }) {
    aggregate {
      count
    }
    nodes {
      account {
        label
      }
      triple {
        id
        subject {
          id
          label
          image
          type
        }
        predicate {
          id
          label
          image
          type
        }
        object {
          id
          label
          image
          type
        }
        vault {
          id
          positions_aggregate {
            aggregate {
              count
            }
          }
        }
        counter_vault {
          id
          positions_aggregate {
            aggregate {
              count
            }
          }
        }
      }
      id
      vault_id
      counter_vault_id
      shares
      counter_shares
    }
  }
}

query GetClaimsByUri($uri: String, $address: String) {
  atoms(
    where: {
      _or: [
        { data: { _eq: $uri } }
        { value: { thing: { url: { _eq: $uri } } } }
        { value: { person: { url: { _eq: $uri } } } }
        { value: { organization: { url: { _eq: $uri } } } }
        { value: { book: { url: { _eq: $uri } } } }
      ]
    }
  ) {
    as_object_claims_aggregate {
      aggregate {
        count
      }
      nodes {
        id
        predicate {
          label
          image
          type
          id
        }
        subject {
          image
          label
          type
          id
        }
        object {
          label
          image
          type
          id
        }
        vault {
          id
          positions_aggregate {
            aggregate {
              count
            }
          }
          positions(where: { account_id: { _eq: $address } }) {
            shares
          }
        }
        counter_vault {
          id
          positions_aggregate {
            aggregate {
              count
            }
          }
          positions(where: { account_id: { _eq: $address } }) {
            shares
          }
        }
        triple_id
        shares
        counter_shares
      }
    }
    as_subject_claims_aggregate {
      aggregate {
        count
      }
      nodes {
        id
        predicate {
          label
          image
          type
          id
        }
        object {
          label
          image
          type
          id  
        }
        subject {
          label
          image
          type
          id
        }
        vault {
          id
          positions_aggregate {
            aggregate {
              count
            }
          }
          positions(where: { account_id: { _eq: $address } }) {
            shares
          }
        }
        counter_vault {
          id
          positions_aggregate {
            aggregate {
              count
            }
          }
          positions(where: { account_id: { _eq: $address } }) {
            shares
          }
        }
        triple_id
        shares
        counter_shares
      }
    }
    id
    label
    image
    vault {
      position_count
    }
    value {
      thing {
        description
        url
      }
    }
  }
}

query GetClaimsByAtom($id: numeric, $address: String) {
  claims_aggregate(
    where: {
      _or: [
        { object_id: { _eq: $id } }
        { subject_id: { _eq: $id } }
        { predicate_id: { _eq: $id } }
      ]
    }
  ) {
    aggregate {
      count
    }
    nodes {
      account {
        label
      }
      triple {
        id
        subject {
          id
          label
          image
          type
        }
        predicate {
          id
          label
          image
          type
        }
        object {
          id
          label
          image
          type
        }
        vault {
          id
          positions(where: { account_id: { _eq: $address } }) {
            shares
            account {
              id
            }
          }
          positions_aggregate {
            aggregate {
              count
            }
          }
        }
        counter_vault {
          id
          positions(where: { account_id: { _eq: $address } }) {
            shares
            account {
              id
            }
          }
          positions_aggregate {
            aggregate {
              count
            }
          }
        }
      }
    }
  }
}