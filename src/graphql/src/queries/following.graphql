query getFollowingsFromAddress($address: String!) {
  following(args: { address: $address }) {
    id
    image
    label
    type
    positions_aggregate( limit: 10 ) {
      aggregate {
        count
      }
      nodes {
        shares
        vault {
          id
          triple {
            id
            object {
              type
              image
              label
            }
            predicate {
              type
              image
              label
            }
            subject {
              type
              image
              label
            }
            counter_vault {
              id
              positions_aggregate {
                aggregate {
                  count
                }
              }
            }
            vault {
              id
              positions_aggregate {
                aggregate {
                  count
                }
              }
            }
          } 
        }
      }
    }
  }
}
