query GetAtomsByCreator($address: String!) {
  atoms(where: { creator: { id: { _eq: $address } } }) {
    id
    data
    image
    label
    type
    block_number
    block_timestamp
    transaction_hash
    creator_id
    value {
      thing {
        name
        image
        description
        url
      }
    }
    vault_id
    vault {
      position_count
      total_shares
      current_share_price
    }
  }
}



