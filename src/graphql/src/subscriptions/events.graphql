subscription Events($addresses: [String!]!, $limit: Int!) {
  events(    
    where: {
      _or: [
        { deposit_id: { _is_null: false } }
        { atom_id:    { _is_null: false } }
        { triple_id:  { _is_null: false } }
      ]
    }
    order_by: [{ block_number: desc }] 
    limit: $limit) {
    ...EventDetailsSubscription
  }
}
