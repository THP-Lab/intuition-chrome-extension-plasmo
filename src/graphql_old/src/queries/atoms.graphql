query GetAtomsByCreator($address: String!) {
  atoms(where: { creator: { id: { _eq: $address } } }) {
    id
    data
    image
    label
    type
    block_number
    block_timestamp
    transaction_hash
    creator_id
    value {
      thing {
        name
        image
        description
        url
      }
    }
    vault_id
    vault {
      position_count
      total_shares
      current_share_price
    }

    as_subject_claims_aggregate {
      nodes {
        predicate {
          label
          id
        }
        object {
          label
          id
        }
      }
    }
  }
}


query GetAtomsWithPositions(
  $limit: Int
  $offset: Int
  $orderBy: [atoms_order_by!]
  $where: atoms_bool_exp
  $address: String
) {
  total: atoms_aggregate(where: $where) {
    aggregate {
      count
    }
  }
  atoms(limit: $limit, offset: $offset, order_by: $orderBy, where: $where) {
    ...AtomMetadata
    ...AtomTxn
    vault {
      position_count
      total_shares
      current_share_price
      total: positions_aggregate {
        aggregate {
          count
          sum {
            shares
          }
        }
      }
      positions(where: { account_id: { _eq: $address } }) {
        id
        account {
          label
          id
        }
        shares
      }
    }
    creator {
      ...AccountMetadata
    }
    as_subject_claims_aggregate {
      nodes {
        predicate {
          label
          id
        }
        object {
          label
          id
        }
      }
    }
  }
}



